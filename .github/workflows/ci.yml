name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-package:
    name: Core package (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path Packages/DayflowCore

  app:
    name: App build and tests (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Dayflow/Dayflow.xcodeproj \
            -scheme Dayflow \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200
